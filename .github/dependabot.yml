# Weekly dependency PRs. cooldown mirrors our release-age gate (pnpm minimumReleaseAge):
# nothing newer than 14 days unless it is a security update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci(deps)" }
